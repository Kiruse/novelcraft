[package]
name = "novelcraft-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.11.1"
chrono = "0.4"
dirs = "6"
env_logger = "0.11"
log = "0.4"
futures = "0.3"
kiruklaw-agent-loop = { git = "https://github.com/Kiruse/kiruklaw", package = "kiruklaw-agent-loop" }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
