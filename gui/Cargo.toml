[package]
name = "novelcraft-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "novelcraft"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
log.workspace = true
env_logger.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

dioxus = { version = "0.7", features = ["desktop", "router"] }
novelcraft-engine = { path = "../engine" }
reqwest = { version = "0.12", features = ["json"] }
