[package]
name = "novelcraft-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "novelcraft"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true

novelcraft-engine = { path = "../engine" }
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["font-kit", "wayland", "x11"] }
schemars = "1.2"
env_logger.workspace = true
