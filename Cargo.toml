[workspace]
members = ["engine", "gui"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
dirs = "6"
exhaustive-map = { version = "0.3", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
futures = "0.3"
itertools = "0.15.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time", "io-util", "rt"] }
unicode-segmentation = "1"

[profile.dev]
# Line tables only: full DWARF was ~98% of every artifact under target/
# (one binary was 227MB, 223MB of it debuginfo). Backtraces keep line
# numbers; only gdb's type/variable detail is lost.
debug = "line-tables-only"
